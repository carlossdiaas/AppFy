<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Mercadinho Lima PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[--color-bg]">

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-2 mb-6">
      <img src="img/logo-mercadinho-lima.png" alt="Mercadinho Lima" class="w-16 h-16 rounded-xl object-cover border border-[--color-border]" />
      <h1 class="text-lg font-bold text-[--color-ink]">Mercadinho Lima — PDV</h1>
      <p class="text-xs text-slate-500">Entre com a sua conta para acessar o sistema</p>
    </div>

    <div class="card p-5" id="login-card">
      <div id="login-erro" class="hidden text-xs bg-red-50 border border-red-200 text-[--color-danger] rounded-lg px-3 py-2 mb-3"></div>
      <div id="login-aviso" class="hidden text-xs bg-blue-50 border border-blue-200 text-blue-800 rounded-lg px-3 py-2 mb-3"></div>

      <form id="form-login" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">E-mail</label>
          <input id="campo-email" type="email" autocomplete="username" required class="input w-full" placeholder="voce@exemplo.com" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">Senha</label>
          <input id="campo-senha" type="password" autocomplete="current-password" required minlength="6" class="input w-full" placeholder="••••••••" />
        </div>
        <button type="submit" id="btn-entrar" class="btn btn-primary w-full py-2.5">Entrar</button>
      </form>

      <div class="flex items-center justify-between mt-3 text-xs">
        <button type="button" class="text-[--color-primary] hover:underline" onclick="alternarModoCadastro()" id="link-cadastro">Criar uma conta nova</button>
        <button type="button" class="text-slate-500 hover:underline" onclick="esqueciSenha()">Esqueci a senha</button>
      </div>
    </div>

    <p class="text-[11px] text-slate-400 text-center mt-4">
      Cada conta tem os próprios dados (produtos, clientes, vendas), guardados com segurança na sua conta do Firebase.
    </p>
  </div>
</div>

<script src="js/bootstrap.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/login.js"></script>
</body>
</html>
